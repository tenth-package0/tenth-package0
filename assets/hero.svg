<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Kebron Tadesse — software engineer</title><desc id="desc">An animated orbital system surrounding the initials KT.</desc>
<defs><linearGradient id="bg" x2="1200" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#071426"/><stop offset=".52" stop-color="#0B2040"/><stop offset="1" stop-color="#20104D"/></linearGradient><linearGradient id="accent" x1="330" y1="100" x2="840" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#60A5FA"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient><radialGradient id="glow"><stop stop-color="#38BDF8" stop-opacity=".28"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="22"/></filter><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".55"/></filter>
<style>.orbit-a{transform-origin:214px 215px;animation:spin 12s linear infinite}.orbit-b{transform-origin:214px 215px;animation:spin 18s linear infinite reverse}.pulse{animation:pulse 3s ease-in-out infinite}.dash{stroke-dasharray:10 14;animation:dash 15s linear infinite}.cursor{animation:blink 1s steps(2,end) infinite}.rise{animation:rise .9s ease-out both}.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.45;transform:scale(.96)}}@keyframes dash{to{stroke-dashoffset:-480}}@keyframes blink{50%{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="1200" height="430" rx="26" fill="url(#bg)"/><circle cx="195" cy="200" r="190" fill="url(#glow)" filter="url(#blur)"/><circle cx="1060" cy="50" r="220" fill="#8B5CF6" opacity=".08" filter="url(#blur)"/><path d="M0 349C210 307 330 397 539 348C755 297 906 299 1200 362V430H0V349Z" fill="#38BDF8" opacity=".045"/><path d="M0 374C246 328 383 423 607 370C800 325 965 347 1200 389" stroke="#60A5FA" stroke-opacity=".16" stroke-width="2"/>
<g filter="url(#shadow)"><circle cx="214" cy="215" r="101" fill="#071A30" stroke="url(#accent)" stroke-width="2"/><circle cx="214" cy="215" r="132" stroke="#93C5FD" stroke-opacity=".25"/><circle cx="214" cy="215" r="158" stroke="#A78BFA" stroke-opacity=".2" class="dash"/><g class="orbit-a"><circle cx="346" cy="215" r="7" fill="#22D3EE"/><circle cx="346" cy="215" r="16" fill="#22D3EE" opacity=".12" class="pulse"/></g><g class="orbit-b"><circle cx="214" cy="57" r="6" fill="#A78BFA"/><circle cx="214" cy="57" r="14" fill="#A78BFA" opacity=".12" class="pulse"/></g><text x="214" y="235" text-anchor="middle" fill="white" font-family="ui-monospace,monospace" font-size="58" font-weight="800" letter-spacing="-4">KT</text></g>
<g font-family="Inter,ui-sans-serif,system-ui,sans-serif"><g class="rise"><text x="430" y="135" fill="#7DD3FC" font-size="16" font-weight="700" letter-spacing="4">HELLO, I'M</text><text x="430" y="205" fill="white" font-size="64" font-weight="800" letter-spacing="-2">Kebron Tadesse</text></g><text x="430" y="255" fill="#CBD5E1" font-size="24" class="rise d1">Product-minded software engineer</text><g class="rise d2" font-family="ui-monospace,monospace" font-size="18"><text x="430" y="309" fill="#64748B">$</text><text x="455" y="309" fill="url(#accent)">idea → system → production</text><rect x="747" y="290" width="10" height="24" rx="2" fill="#22D3EE" class="cursor"/></g><g class="rise d3" font-size="15" font-weight="600"><rect x="430" y="340" width="144" height="38" rx="19" fill="#0EA5E9" fill-opacity=".15" stroke="#38BDF8" stroke-opacity=".35"/><text x="502" y="364" fill="#BAE6FD" text-anchor="middle">SAN DIEGO, CA</text><rect x="589" y="340" width="162" height="38" rx="19" fill="#8B5CF6" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".32"/><text x="670" y="364" fill="#DDD6FE" text-anchor="middle">CS @ SDSU</text><rect x="766" y="340" width="182" height="38" rx="19" fill="#14B8A6" fill-opacity=".12" stroke="#2DD4BF" stroke-opacity=".3"/><text x="857" y="364" fill="#99F6E4" text-anchor="middle">BUILDING WORTHY</text></g></g>
</svg>
