<svg width="1200" height="180" viewBox="0 0 1200 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">From idea to production</title><desc id="desc">An animated software product development loop.</desc><defs><linearGradient id="line" x1="120" x2="1080"><stop stop-color="#60A5FA"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient><style>.flow{stroke-dasharray:7 10;animation:move 7s linear infinite}.node{animation:breathe 3s ease-in-out infinite}.n2{animation-delay:.45s}.n3{animation-delay:.9s}.n4{animation-delay:1.35s}@keyframes move{to{stroke-dashoffset:-170}}@keyframes breathe{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1200" height="180" rx="22" fill="#0B1220"/><path d="M150 90H1050" stroke="#1E293B" stroke-width="4"/><path d="M150 90H1050" stroke="url(#line)" stroke-width="3" class="flow"/><g font-family="Inter,ui-sans-serif,system-ui" text-anchor="middle"><g class="node"><circle cx="150" cy="90" r="42" fill="#0F2443" stroke="#60A5FA" stroke-width="2"/><text x="150" y="84" fill="#BFDBFE" font-size="15" font-weight="700">01</text><text x="150" y="106" fill="white" font-size="16" font-weight="700">IDEA</text></g><g class="node n2"><circle cx="450" cy="90" r="42" fill="#0C2734" stroke="#22D3EE" stroke-width="2"/><text x="450" y="84" fill="#A5F3FC" font-size="15" font-weight="700">02</text><text x="450" y="106" fill="white" font-size="16" font-weight="700">DESIGN</text></g><g class="node n3"><circle cx="750" cy="90" r="42" fill="#102A33" stroke="#2DD4BF" stroke-width="2"/><text x="750" y="84" fill="#99F6E4" font-size="15" font-weight="700">03</text><text x="750" y="106" fill="white" font-size="16" font-weight="700">BUILD</text></g><g class="node n4"><circle cx="1050" cy="90" r="42" fill="#241A45" stroke="#A78BFA" stroke-width="2"/><text x="1050" y="84" fill="#DDD6FE" font-size="15" font-weight="700">04</text><text x="1050" y="106" fill="white" font-size="16" font-weight="700">SHIP</text></g></g></svg>
