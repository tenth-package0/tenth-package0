<svg width="1200" height="130" viewBox="0 0 1200 130" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">From idea to production</title><desc id="desc">A minimal software product process.</desc>
  <defs><linearGradient id="line" x1="160" x2="1040"><stop stop-color="#7DD3FC"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient><style>.pulse{animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{opacity:.5}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
  <rect width="1200" height="130" rx="20" fill="#0F172A"/><path d="M160 65H1040" stroke="#334155"/><path d="M160 65H1040" stroke="url(#line)" stroke-width="2" stroke-dasharray="220 660" class="pulse"/>
  <g font-family="Inter,ui-sans-serif,system-ui" text-anchor="middle" font-size="14" font-weight="650" letter-spacing="1.5"><circle cx="160" cy="65" r="5" fill="#7DD3FC"/><text x="160" y="100" fill="#CBD5E1">IDEA</text><circle cx="453" cy="65" r="5" fill="#93C5FD"/><text x="453" y="100" fill="#CBD5E1">DESIGN</text><circle cx="746" cy="65" r="5" fill="#A5B4FC"/><text x="746" y="100" fill="#CBD5E1">BUILD</text><circle cx="1040" cy="65" r="5" fill="#C4B5FD"/><text x="1040" y="100" fill="#CBD5E1">SHIP</text></g>
</svg>
